name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t webaudioarchive:ci .
      - run: docker build -f docker/Dockerfile.web -t webaudioarchive-web:ci .
      - run: docker build -f docker/Dockerfile.analysis -t webaudioarchive-analysis:ci .
      - run: docker compose -f docker/docker-compose.analysis.yml config --quiet
      - run: docker compose -f docker/docker-compose.whisper-dev.yml config --quiet
      - run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.web-analysis.yml config --quiet
