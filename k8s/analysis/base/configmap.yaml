# Non-secret settings, the same names and values as docker/docker-compose.analysis.yml (all documented in docs/analysis.md).
# Edit them in an overlay patch, not here. Tokens never go here: see secret.yaml.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: waa-analysis-settings
data:
  WAA_STATION: burst
  # Recording roots inside the pod: the claims are mounted read only at /data/a and /data/b.
  WAA_RECORDERS: a=/data/a,b=/data/b
  WAA_ANALYSIS_PREFERENCE: a,b
  WAA_ANALYSIS_OUT: /analysis
  WAA_SCRATCH: /scratch
  WAA_SCRATCH_MAX_MB: "2048"
  WAA_MIN_FREE_GB: "20"
  WAA_LAG_ALARM_HOURS: "6"
  WAA_ANALYSIS_CONFIG: /config/analysis/analysis.json
  WAA_STATIONS_CONFIG: /config/stations.json
  WAA_SCHEDULE_FILE: /web-cache/schedule/burst.json
  WAA_PORT: "8080"
  # Speech to text (decision D19): the whisper.cpp server on the owner's GPU server, plain HTTP on the private network.
  # Named hosts must be in the allow-list or the service refuses to start; private IPs are accepted without it.
  WAA_WHISPER_URL: http://pdl-rune-02.panoramicdata.com:8080
  WAA_WHISPER_ALLOWED_HOSTS: pdl-rune-02.panoramicdata.com,pdl-rune-01.panoramicdata.com
  WAA_WHISPER_MODEL: ggml-large-v3-turbo-q8_0
  # Show enrichment: the owner's Ollama. pdl-rune-01 has qwen3.6:27b rather than qwen3.6:latest.
  WAA_OLLAMA_URL: http://pdl-rune-02.panoramicdata.com:11434
  WAA_OLLAMA_ALLOWED_HOSTS: pdl-rune-02.panoramicdata.com,pdl-rune-01.panoramicdata.com
  WAA_OLLAMA_MODEL: qwen3.6:latest
  WAA_OLLAMA_KEEP_ALIVE: 5m
  WAA_ENRICHMENT: "on"
