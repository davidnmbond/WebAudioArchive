# Analysis only (plan 3 Task 22, issue #110). Namespace agnostic: the overlay (or kubectl -n) chooses the namespace.
# Nothing in this folder defines, patches or selects a recorder workload; applying it never touches one.
# Not listed on purpose: secret.yaml.example (a template, see the README) and the recordings claims (they belong to the
# recorders' own kustomization and are only referenced by name from the Deployment).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - priorityclass.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: webaudioarchive
    includeSelectors: false
