# Cluster scoped, so it is created once for the whole cluster (apply needs the right to create PriorityClasses; if the
# owner cannot, delete this file and its line in kustomization.yaml and remove priorityClassName from the Deployment).
# Below the default (0) and never preempting: under pressure the scheduler and kubelet drop analysis before anything else.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: analysis-low
value: -100
globalDefault: false
preemptionPolicy: Never
description: "WebAudioArchive analysis: batch work that must never displace the recorders or the web app."
