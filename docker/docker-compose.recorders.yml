# Two independent recorders (A and B) for the same stations, in their OWN compose project (name: waa-recorders), so
# building, restarting or recreating anything in another project (web, consolidator, analysis) can never touch them
# (issue #102). Each holds its own stream connection and writes to its own data folder, so one can be stopped,
# rebuilt or upgraded while the other keeps recording. This is the only file that builds the webaudioarchive:local
# image; the consolidator in docker-compose.yml runs the same image but never builds it.
# Upgrade one at a time: `docker compose -f docker/docker-compose.recorders.yml up -d --build recorder-a`, confirm it
# is healthy and recording, then do the same for recorder-b. Never stop both together. Always name the service.
name: waa-recorders

x-recorder: &recorder
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: webaudioarchive:local
  restart: always
  stop_grace_period: 30s

services:
  recorder-a:
    <<: *recorder
    container_name: waa-recorder-a
    labels:
      waa.role: recorder
    environment:
      WAA_INSTANCE_ID: ${WAA_INSTANCE_ID:-home}-a
    volumes:
      - ${WAA_DATA_DIR:-../data}/a:/data
      - ../config:/config:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - waa

  recorder-b:
    <<: *recorder
    container_name: waa-recorder-b
    labels:
      waa.role: recorder
    environment:
      WAA_INSTANCE_ID: ${WAA_INSTANCE_ID:-home}-b
    volumes:
      - ${WAA_DATA_DIR:-../data}/b:/data
      - ../config:/config:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - waa

# The network the web app and the consolidator use to reach the recorders (/healthz). This project creates it; the
# main project joins it as an external network, so the recorders must be started first.
networks:
  waa:
    name: waa
