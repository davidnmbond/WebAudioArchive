# The web app and the consolidator. The recorders are NOT here: they are their own compose project in
# docker-compose.recorders.yml (name: waa-recorders), so nothing in this file can recreate, restart or rebuild a
# recorder (issue #102). This file keeps its implicit project name (docker) because the analysis project joins the
# docker_web-cache volume by that name. Always name the service you start, and never use --remove-orphans.
# Both services reach the recorders over the external network "waa", created by the recorders project.

services:
  # The web app: Status, Shows, Recordings and Player pages plus the clip API, at http://127.0.0.1:8090.
  # NO SIGN-IN in this version, so it is published on loopback only. It reads the recorders' data read-only and talks
  # to them only through /healthz; it has its own image, so it is rebuilt and restarted on its own and never touches
  # a recorder: `docker compose -f docker/docker-compose.yml up -d --build web` (always name the service).
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: webaudioarchive-web:local
    container_name: waa-web
    restart: always
    environment:
      WAA_STATION: burst
      WAA_RECORDERS: a=/data/a,b=/data/b
      WAA_RECORDER_HEALTH: a=http://recorder-a:8080/healthz,b=http://recorder-b:8080/healthz
      WAA_CACHE: /cache
      # The Shows tab reads the station's scheduleUrl and timezone from here (read-only).
      WAA_STATIONS_CONFIG: /config/stations.json
      # The merged archive and the consolidator's /healthz (issue #104).
      WAA_MERGED: /data/merged
      WAA_CONSOLIDATOR: http://consolidator:8080
    volumes:
      - ${WAA_DATA_DIR:-../data}:/data:ro
      - ../config:/config:ro
      - web-cache:/cache
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - waa

  # The consolidator (issue #104): the recorder image started with --consolidate. It merges the A and B hours into
  # data/merged once analysis has finished them, holds and rechecks the originals, and deletes only on confirmation.
  # The image is built only from the recorders file, so this service has no build and no depends_on: starting or
  # rebuilding it can never recreate a recorder. Health: http://127.0.0.1:8096/healthz.
  # New code: build the shared image from the recorders file (running recorders are left alone), then recreate this:
  #   docker compose -f docker/docker-compose.recorders.yml build recorder-a
  #   docker compose -f docker/docker-compose.yml up -d consolidator   (name the service)
  # On Linux create data/merged owned by uid 1654 before the first start, or Docker creates it as root.
  consolidator:
    image: webaudioarchive:local
    container_name: waa-consolidator
    command: ["--consolidate"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      WAA_STATION: burst
      WAA_SOURCES: a=/data/a,b=/data/b
      WAA_MERGED: /data/merged
      WAA_ANALYSIS: /data/analysis
      WAA_CONSOLIDATE_MODE: merge
    volumes:
      - ${WAA_DATA_DIR:-../data}/a:/data/a
      - ${WAA_DATA_DIR:-../data}/b:/data/b
      - ${WAA_DATA_DIR:-../data}/merged:/data/merged
      - ${WAA_DATA_DIR:-../data}/analysis:/data/analysis:ro
    ports:
      - "127.0.0.1:8096:8080"
    healthcheck:
      test: ["CMD", "dotnet", "WebAudioArchive.Worker.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - waa

networks:
  waa:
    external: true

volumes:
  web-cache:
