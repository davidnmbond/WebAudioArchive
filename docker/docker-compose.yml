# Two independent recorders (A and B) for the same stations. Each holds its own stream connection and writes to
# its own data folder, so one can be stopped, rebuilt or upgraded while the other keeps recording.
# Upgrade one at a time: `docker compose -f docker/docker-compose.yml up -d --build recorder-a`, confirm it is
# healthy and recording, then do the same for recorder-b. Never stop both together.
x-recorder: &recorder
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: webaudioarchive:local
  restart: always
  stop_grace_period: 30s

services:
  recorder-a:
    <<: *recorder
    container_name: waa-recorder-a
    environment:
      WAA_INSTANCE_ID: ${WAA_INSTANCE_ID:-home}-a
    volumes:
      - ${WAA_DATA_DIR:-../data}/a:/data
      - ../config:/config:ro
    ports:
      - "127.0.0.1:8080:8080"

  recorder-b:
    <<: *recorder
    container_name: waa-recorder-b
    environment:
      WAA_INSTANCE_ID: ${WAA_INSTANCE_ID:-home}-b
    volumes:
      - ${WAA_DATA_DIR:-../data}/b:/data
      - ../config:/config:ro
    ports:
      - "127.0.0.1:8081:8080"

  # The web app: Status, Recordings and Player pages plus the clip API, at http://127.0.0.1:8090.
  # NO SIGN-IN in this version, so it is published on loopback only. It reads the recorders' data read-only and talks
  # to them only through /healthz; it has its own image, so it is rebuilt and restarted on its own and never touches
  # a recorder: `docker compose -f docker/docker-compose.yml up -d --build web` (always name the service).
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: webaudioarchive-web:local
    container_name: waa-web
    restart: always
    environment:
      WAA_STATION: burst
      WAA_RECORDERS: a=/data/a,b=/data/b
      WAA_RECORDER_HEALTH: a=http://recorder-a:8080/healthz,b=http://recorder-b:8080/healthz
      WAA_CACHE: /cache
    volumes:
      - ${WAA_DATA_DIR:-../data}:/data:ro
      - web-cache:/cache
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  web-cache:
