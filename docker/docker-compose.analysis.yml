# Analysis (plan 3): transcripts, detectors, events and show enrichment. Its OWN compose project (name: waa-analysis),
# separate from the recorder project, so nothing here can recreate, restart or rebuild a recorder or the web app.
# Below the recorders' priority (nice 10, low CPU shares, capped CPU and memory, killed first under memory pressure).
# It reads the recorders' folders read-only, writes only data/analysis and a 2 GiB tmpfs scratch, and stops first when
# free disk falls below WAA_MIN_FREE_GB. CPU only (decision D19): speech to text is an HTTP call to the whisper.cpp server
# container on the owner's GPU servers (WAA_WHISPER_URL), so the image has no GPU, no CUDA, no model and no models mount.
# Health: http://127.0.0.1:8095/healthz. Settings, checks and the first-run checklist: docs/analysis.md.
#   docker compose -f docker/docker-compose.analysis.yml up -d --build analysis
# The schedule cache is the web app's volume, shared read-only. It is external because the web app lives in another
# compose project; its name is the web project's name plus "_web-cache" (docker_web-cache today). If the recorder
# project is renamed, set WAA_WEB_CACHE_VOLUME to the new name (docker volume ls).
name: waa-analysis

services:
  analysis:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analysis
    image: webaudioarchive-analysis:local
    container_name: waa-analysis
    restart: unless-stopped
    # A graceful stop finishes or aborts the current chunk and restores the job's attempts before Docker kills it.
    stop_grace_period: 90s
    user: "${APP_UID:-1654}"
    environment:
      WAA_STATION: burst
      WAA_RECORDERS: a=/data/a,b=/data/b
      WAA_ANALYSIS_PREFERENCE: a,b
      WAA_ANALYSIS_OUT: /analysis
      WAA_SCRATCH: /scratch
      WAA_SCRATCH_MAX_MB: "2048"
      WAA_MIN_FREE_GB: ${WAA_MIN_FREE_GB:-20}
      # Speech to text (decision D19): the whisper.cpp server on the owner's GPU servers, pdl-rune-02 for this machine (test) and
      # pdl-rune-01 for production, port 8080. The audio chunks (16 kHz mono WAV, about 5 minutes) are sent there over plain HTTP
      # on the private network; named hosts must be in WAA_WHISPER_ALLOWED_HOSTS or the service refuses to start. The server is
      # started by the owner (plan 3 Task 23); until it answers, /healthz shows whisperReady false and the service is paused.
      # For a local server see docker/docker-compose.whisper-dev.yml (development only).
      WAA_WHISPER_URL: ${WAA_WHISPER_URL:-http://pdl-rune-02.panoramicdata.com:8080}
      WAA_WHISPER_ALLOWED_HOSTS: ${WAA_WHISPER_ALLOWED_HOSTS:-pdl-rune-02.panoramicdata.com,pdl-rune-01.panoramicdata.com}
      WAA_WHISPER_MODEL: ${WAA_WHISPER_MODEL:-ggml-large-v3-turbo-q8_0}
      # The owner's Ollama servers (decision 2026-10-17): pdl-rune-02 for this machine (test), pdl-rune-01 for production.
      # Named hosts must be in WAA_OLLAMA_ALLOWED_HOSTS. Transcript text goes to the server named here over plain HTTP on the
      # private network. pdl-rune-01 has qwen3.6:27b rather than qwen3.6:latest: set WAA_OLLAMA_MODEL when pointing at it.
      WAA_OLLAMA_URL: ${WAA_OLLAMA_URL:-http://pdl-rune-02.panoramicdata.com:11434}
      WAA_OLLAMA_ALLOWED_HOSTS: ${WAA_OLLAMA_ALLOWED_HOSTS:-pdl-rune-02.panoramicdata.com,pdl-rune-01.panoramicdata.com}
      WAA_OLLAMA_MODEL: ${WAA_OLLAMA_MODEL:-qwen3.6:latest}
      WAA_OLLAMA_KEEP_ALIVE: ${WAA_OLLAMA_KEEP_ALIVE:-5m}
      WAA_ENRICHMENT: ${WAA_ENRICHMENT:-on}
      WAA_ANALYSIS_CONFIG: /config/analysis/analysis.json
      WAA_STATIONS_CONFIG: /config/stations.json
      WAA_SCHEDULE_FILE: /web-cache/schedule/burst.json
      WAA_LAG_ALARM_HOURS: "6"
    volumes:
      - ${WAA_DATA_DIR:-../data}/a:/data/a:ro
      - ${WAA_DATA_DIR:-../data}/b:/data/b:ro
      - ${WAA_DATA_DIR:-../data}/analysis:/analysis
      - ../config:/config:ro
      - web-cache:/web-cache:ro
    tmpfs:
      - /scratch:size=2g,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 6
    cpu_shares: 256
    mem_limit: 6g
    oom_score_adj: 800
    pids_limit: 512
    # No capability is needed: nice with a positive value is allowed to any user, and the service only binds a port above 1024.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8095:8080"

volumes:
  web-cache:
    external: true
    name: ${WAA_WEB_CACHE_VOLUME:-docker_web-cache}
